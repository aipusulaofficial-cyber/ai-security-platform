name: Executable Test Evidence
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install project test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Execute full test suite
        run: |
          mkdir -p artifacts
          python -m pytest -q --junitxml=artifacts/test-results.xml
      - name: Generate executable evidence summary
        run: |
          python - <<'PY'
          import json
          import xml.etree.ElementTree as ET
          from pathlib import Path
          root = ET.parse("artifacts/test-results.xml").getroot()
          summary = {
              "tests": int(root.attrib.get("tests", 0)),
              "failures": int(root.attrib.get("failures", 0)),
              "errors": int(root.attrib.get("errors", 0)),
              "skipped": int(root.attrib.get("skipped", 0)),
          }
          summary["pass_rate"] = ((summary["tests"] - summary["failures"] - summary["errors"]) / summary["tests"]) if summary["tests"] else 0.0
          Path("artifacts/executable-evidence.json").write_text(json.dumps(summary, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          if summary["failures"] or summary["errors"]:
              raise SystemExit(f"executable evidence gate failed: {summary}")
          print(summary)
          PY
      - name: Upload executable evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: executable-test-evidence
          path: artifacts/
          if-no-files-found: error
