name: one-time-ruff-autofix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  autofix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: python -m pip install --upgrade pip ruff==0.16.9
      - name: Auto-fix Ruff
        run: |
          ruff check --fix .
          ruff format .
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No Ruff changes needed"
          else
            git commit -m "chore: apply Ruff 0.16.9 fixes"
            git push
          fi