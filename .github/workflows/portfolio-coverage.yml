name: Portfolio Coverage Evidence
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install --disable-pip-version-check -e ".[dev]"
          python -m pip install --disable-pip-version-check "pytest-cov>=6,<7"
      - name: Run tests with coverage
        run: |
          mkdir -p artifacts
          python -m pytest -q --cov=. --cov-report=term-missing --cov-report=xml:artifacts/coverage.xml --junitxml=artifacts/coverage-test-results.xml
      - name: Generate coverage summary
        run: |
          python - <<'PY'
          import json, xml.etree.ElementTree as ET
          from pathlib import Path
          root = ET.parse("artifacts/coverage.xml").getroot()
          tests = ET.parse("artifacts/coverage-test-results.xml").getroot()
          summary = {"line_rate": float(root.attrib.get("line-rate", 0.0)), "tests": int(tests.attrib.get("tests", 0)), "failures": int(tests.attrib.get("failures", 0)), "errors": int(tests.attrib.get("errors", 0))}
          summary["coverage_percent"] = round(summary["line_rate"] * 100, 2)
          Path("artifacts/coverage-summary.json").write_text(json.dumps(summary, indent=2, sort_keys=True)+"\n")
          if summary["failures"] or summary["errors"]: raise SystemExit(summary)
          print(summary)
          PY
      - name: Upload portfolio coverage evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: portfolio-coverage-evidence
          path: artifacts/
          if-no-files-found: error
