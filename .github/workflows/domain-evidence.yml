name: Domain Executable Evidence
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Execute domain evidence
        run: |
          mkdir -p artifacts
          python benchmarks/security_evidence.py | tee artifacts/security-domain-evidence.json
      - name: Validate evidence artifact
        run: python -m json.tool artifacts/security-domain-evidence.json >/dev/null
      - name: Upload domain evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: security-domain-evidence
          path: artifacts/security-domain-evidence.json
          if-no-files-found: error
