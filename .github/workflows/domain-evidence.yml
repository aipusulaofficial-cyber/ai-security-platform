name: Domain Executable Evidence
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Execute domain evidence
        run: |
          mkdir -p artifacts
          python benchmarks/security_evidence.py | tee artifacts/security-domain-evidence.json
      - name: Validate evidence artifact
        run: python -m json.tool artifacts/security-domain-evidence.json >/dev/null
      - name: Upload domain evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: security-domain-evidence
          path: artifacts/security-domain-evidence.json
          if-no-files-found: error
