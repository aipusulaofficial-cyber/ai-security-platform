apiVersion: apps/v1
kind: Deployment
metadata: {name: {{ .Chart.Name }}}
spec:
 replicas: 2
 selector: {matchLabels: {app: {{ .Chart.Name }}}}
 template:
  metadata: {labels: {app: {{ .Chart.Name }}}}
  spec:
   containers:
   - name: api
     image: {{ .Chart.Name }}:latest
     ports: [{containerPort: 8000}]
     readinessProbe: {httpGet: {path: /health/ready, port: 8000}}
     livenessProbe: {httpGet: {path: /health/live, port: 8000}}
